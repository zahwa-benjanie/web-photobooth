<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snapiku · Web Photobooth</title>
<meta name="description" content="Photobooth berbasis browser — jepret foto beruntun, pilih bingkai lucu, unduh hasilnya.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-dots" aria-hidden="true"></div>

<div class="lang-toggle" id="langToggle" role="group" aria-label="Language / Bahasa">
  <button type="button" class="lang-btn is-active" data-lang="id" aria-pressed="true">ID</button>
  <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
</div>

<header class="site-head">
  <div class="brand">
    <span class="brand-mark">✦</span>
    <span class="brand-name">Snapiku</span>
  </div>
</header>

<main class="layout">

  <!-- STEP RAIL -->
  <ol class="step-rail" id="stepRail">
    <li class="step is-active" data-step="1"><span class="step-num">1</span><span class="step-label" data-i18n="step1">Pilih Bingkai</span></li>
    <li class="step" data-step="2"><span class="step-num">2</span><span class="step-label" data-i18n="step2">Jepret Foto</span></li>
    <li class="step" data-step="3"><span class="step-num">3</span><span class="step-label" data-i18n="step3">Simpan</span></li>
  </ol>

  <div class="workspace">

    <!-- LEFT: frame gallery + options -->
    <section class="panel panel-side" aria-label="Pengaturan bingkai">
      <h2 class="panel-title" data-i18n="frameLabel">Bingkai</h2>
      <div class="frame-gallery" id="frameGallery"><!-- injected by JS --></div>

      <div class="option-block">
        <h3 class="option-title" data-i18n="filterLabel">Filter foto</h3>
        <div class="filter-row" id="filterRow"><!-- injected by JS --></div>
      </div>

      <div class="option-block">
        <h3 class="option-title" data-i18n="textDateLabel">Teks &amp; tanggal</h3>
        <label class="field">
          <span data-i18n="customTextLabel">Teks custom (opsional)</span>
          <input type="text" id="captionInput" maxlength="40" placeholder="cth. Kelas Fisika · 2026" data-i18n-placeholder="customTextPlaceholder">
        </label>
        <label class="check">
          <input type="checkbox" id="dateToggle" checked>
          <span data-i18n="showDateLabel">Tampilkan tanggal hari ini</span>
        </label>
      </div>
    </section>

    <!-- RIGHT: camera stage / result -->
    <section class="panel panel-stage" aria-label="Kamera dan hasil">

      <div class="stage" id="stage">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="resultCanvas" class="result-canvas hidden"></canvas>

        <div class="stage-overlay" id="cameraMsg">
          <p data-i18n="cameraActivating">Mengaktifkan kamera…</p>
        </div>

        <div class="countdown" id="countdown" aria-live="polite"></div>
        <div class="flash" id="flash" aria-hidden="true"></div>

        <div class="shot-counter hidden" id="shotCounter"></div>
      </div>

      <div class="filmstrip" id="filmstrip" aria-label="Foto yang sudah diambil"></div>

      <div class="controls">
        <button class="btn btn-primary" id="snapBtn" disabled data-i18n="startSnap">Start Snap</button>
        <button class="btn btn-ghost hidden" id="retakeBtn" data-i18n="retake">Ambil Ulang</button>
        <button class="btn btn-primary hidden" id="downloadBtn" data-i18n="download">Unduh PNG</button>
        <button class="btn btn-ghost hidden" id="newFrameBtn" data-i18n="newFrame">Ganti Bingkai</button>
      </div>

      <p class="hint" id="hint">Pilih bingkai dulu di sebelah kiri, lalu izinkan akses kamera untuk mulai.</p>
    </section>

  </div>
</main>

<script src="script.js"></script>
</body>
</html>
